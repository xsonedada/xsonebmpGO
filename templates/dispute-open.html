{{define "dispute-open"}}
<style>
    :root {
        --bg-deep: #08081c;
        --surface: rgba(18,18,44,0.75);
        --border: rgba(255,255,255,0.06);
        --border-hover: rgba(255,255,255,0.12);
        --text-primary: #f1f1f9;
        --text-secondary: rgba(255,255,255,0.45);
        --text-dim: rgba(255,255,255,0.25);
        --accent: #8b5cf6;
        --accent-light: #c084fc;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --radius-card: 2.25rem;
        --radius-item: 1.25rem;
        --transition: 0.25s cubic-bezier(0.33, 1, 0.68, 1);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(28px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes subtleShimmer {
        0% { background-position: -200% 50%; }
        100% { background-position: 200% 50%; }
    }
    @keyframes gradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
    }

    body {
        background: radial-gradient(ellipse at 50% 0%, #15153a 0%, #08081c 70%);
        background-attachment: fixed;
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-primary);
        letter-spacing: -0.01em;
        min-height: 100vh;
    }

    .dispute-open-page {
        max-width: 720px;
        margin: 0 auto;
        padding: 5rem 1.5rem 4rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .dispute-open-back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        transition: color 0.2s;
        width: fit-content;
    }
    .dispute-open-back:hover { color: #f87171; }

    .dispute-open-card {
        background: var(--surface);
        backdrop-filter: blur(45px) saturate(140%);
        -webkit-backdrop-filter: blur(45px) saturate(140%);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 2.5rem;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.5s ease;
        transition: border-color var(--transition), box-shadow var(--transition);
        box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    .dispute-open-card:hover {
        border-color: var(--border-hover);
        box-shadow: 0 24px 48px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(239,68,68,0.15);
    }
    .dispute-open-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, 
            transparent 45%, 
            rgba(255,255,255,0.02) 50%, 
            transparent 55%);
        background-size: 200% 100%;
        animation: subtleShimmer 20s infinite;
        pointer-events: none;
    }
    .dispute-open-card > * { position: relative; z-index: 1; }

    .dispute-open-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.8rem;
    }
    .dispute-open-icon {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: rgba(239,68,68,0.1);
        border: 1px solid rgba(239,68,68,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .dispute-open-icon i {
        font-size: 1.5rem;
        color: #f87171;
    }

    .dispute-open-title {
        font-size: 1.8rem;
        font-weight: 900;
        background: linear-gradient(135deg, #fff 0%, #fecaca 50%, #f87171 100%);
        background-size: 200% 200%;
        animation: gradientFlow 8s ease infinite;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 0.2rem;
        letter-spacing: -0.03em;
    }
    .dispute-open-subtitle {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin: 0;
        font-weight: 500;
    }

    .dispute-open-order {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.9rem 1.3rem;
        border-radius: var(--radius-item);
        background: rgba(239,68,68,0.04);
        border: 1px solid rgba(239,68,68,0.1);
        color: #fca5a5;
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 2rem;
    }
    .dispute-open-order i {
        color: #f87171;
        font-size: 0.85rem;
    }

    .dispute-open-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .dispute-open-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .dispute-open-group label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-dim);
        font-weight: 700;
        margin-left: 0.4rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }
    .dispute-open-group label i {
        font-size: 0.7rem;
        color: #f87171;
    }
    .dispute-open-group select,
    .dispute-open-group textarea {
        padding: 0.9rem 1.3rem;
        border-radius: 1.2rem;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        color: #fff;
        font-size: 0.92rem;
        outline: none;
        transition: all var(--transition);
        font-family: inherit;
        width: 100%;
        box-sizing: border-box;
        letter-spacing: -0.01em;
    }
    .dispute-open-group select:focus,
    .dispute-open-group textarea:focus {
        border-color: #f87171;
        box-shadow: 0 0 0 4px rgba(239,68,68,0.1);
        background: rgba(239,68,68,0.04);
    }
    .dispute-open-group select option {
        background: #1a1a3e;
        color: #fff;
    }
    .dispute-open-group textarea {
        resize: vertical;
        min-height: 130px;
        line-height: 1.6;
    }
    .dispute-open-group select::placeholder,
    .dispute-open-group textarea::placeholder {
        color: var(--text-dim);
    }
    .dispute-open-group .error {
        border-color: var(--danger);
        box-shadow: 0 0 0 4px rgba(239,68,68,0.08);
    }

    .dispute-open-actions {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
    }
    .dispute-open-submit {
        padding: 0.9rem 2.2rem;
        border-radius: 100px;
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: #fff;
        border: none;
        font-weight: 700;
        font-size: 0.92rem;
        cursor: pointer;
        transition: all var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        box-shadow: 0 8px 20px rgba(239,68,68,0.2);
    }
    .dispute-open-submit:hover {
        background: linear-gradient(135deg, #dc2626, #b91c1c);
        box-shadow: 0 14px 30px rgba(239,68,68,0.35);
        transform: translateY(-2px);
    }
    .dispute-open-submit:active {
        transform: translateY(0);
    }
    .dispute-open-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }
    .dispute-open-cancel {
        padding: 0.9rem 2.2rem;
        border-radius: 100px;
        border: 1px solid rgba(255,255,255,0.08);
        color: var(--text-secondary);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.92rem;
        transition: all var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }
    .dispute-open-cancel:hover {
        color: #fff;
        border-color: rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.03);
    }

    @media (max-width: 500px) {
        .dispute-open-card { padding: 2rem 1.5rem; border-radius: 2rem; }
        .dispute-open-title { font-size: 1.5rem; }
        .dispute-open-actions { flex-direction: column; }
        .dispute-open-submit, .dispute-open-cancel { width: 100%; justify-content: center; }
    }
</style>

<section class="dispute-open-page">
    <a href="/order/{{.Data.Order.ID}}" class="dispute-open-back"><i class="fa-solid fa-arrow-left"></i> Назад к заказу</a>

    <div class="dispute-open-card">
        <div class="dispute-open-header">
            <div class="dispute-open-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div>
                <h1 class="dispute-open-title">Открыть спор</h1>
                <p class="dispute-open-subtitle">Опишите проблему с заказом</p>
            </div>
        </div>

        <div class="dispute-open-order">
            <i class="fa-solid fa-hashtag"></i> Заказ #{{.Data.Order.ID}}: {{.Data.Order.Title}}
        </div>

        <form method="POST" action="/order/{{.Data.Order.ID}}/dispute" class="dispute-open-form" id="disputeForm" onsubmit="return handleDisputeSubmit()">
            <!-- Защита -->
            <input type="hidden" name="csrf_token" value="{{.csrf}}">
            <input type="text" name="website" style="display:none;position:absolute;left:-9999px;" tabindex="-1" autocomplete="off">
            <input type="text" name="name" style="display:none;position:absolute;left:-9999px;" tabindex="-1" autocomplete="off">
            <div style="display:none;position:absolute;left:-9999px;">
                <input type="text" name="email_confirm" tabindex="-1" autocomplete="off">
            </div>

            <div class="dispute-open-group">
                <label><i class="fa-solid fa-circle-exclamation"></i> Причина</label>
                <select name="reason" id="reason" required>
                    <option value="">Выберите причину</option>
                    <option value="Заказ не выполнен">Заказ не выполнен</option>
                    <option value="Некачественное выполнение">Некачественное выполнение</option>
                    <option value="Долгое выполнение">Долгое выполнение</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>
            <div class="dispute-open-group">
                <label><i class="fa-solid fa-align-left"></i> Описание проблемы</label>
                <textarea name="description" id="description" rows="4" required placeholder="Опишите ситуацию подробно..."></textarea>
            </div>
            <div class="dispute-open-actions">
                <button type="submit" class="dispute-open-submit" id="submitBtn">
                    <i class="fa-solid fa-flag"></i> Открыть спор
                </button>
                <a href="/order/{{.Data.Order.ID}}" class="dispute-open-cancel">Отмена</a>
            </div>
        </form>
    </div>
</section>
{{end}}
