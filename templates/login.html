{{define "login.html"}}
<style>
    :root {
        --bg-deep: #08081c;
        --surface: rgba(18,18,44,0.75);
        --border: rgba(255,255,255,0.06);
        --border-hover: rgba(255,255,255,0.12);
        --text-primary: #f1f1f9;
        --text-secondary: rgba(255,255,255,0.45);
        --text-dim: rgba(255,255,255,0.25);
        --accent: #8b5cf6;
        --accent-light: #c084fc;
        --success: #10b981;
        --danger: #ef4444;
        --radius-card: 2.25rem;
        --radius-item: 1.25rem;
        --transition: 0.25s cubic-bezier(0.33, 1, 0.68, 1);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(28px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes subtleShimmer {
        0% { background-position: -200% 50%; }
        100% { background-position: 200% 50%; }
    }
    @keyframes gradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
    }

    body {
        background: radial-gradient(ellipse at 50% 0%, #15153a 0%, #08081c 70%);
        background-attachment: fixed;
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-primary);
        letter-spacing: -0.01em;
        min-height: 100vh;
    }

    .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5rem 1.5rem 3rem;
    }

    .login-card {
        width: 100%;
        max-width: 460px;
        background: var(--surface);
        backdrop-filter: blur(45px) saturate(140%);
        -webkit-backdrop-filter: blur(45px) saturate(140%);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 3rem 2.5rem;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.5s ease;
        transition: border-color var(--transition), box-shadow var(--transition);
        box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    .login-card:hover {
        border-color: var(--border-hover);
        box-shadow: 0 24px 48px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(139,92,246,0.08);
    }
    .login-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, 
            transparent 45%, 
            rgba(255,255,255,0.02) 50%, 
            transparent 55%);
        background-size: 200% 100%;
        animation: subtleShimmer 20s infinite;
        pointer-events: none;
    }
    .login-card > * { position: relative; z-index: 1; }

    /* Header */
    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .login-icon {
        width: 60px;
        height: 60px;
        border-radius: 20px;
        background: rgba(139,92,246,0.1);
        border: 1px solid rgba(139,92,246,0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.2rem;
        animation: float 3s ease-in-out infinite;
    }
    .login-icon i {
        font-size: 1.6rem;
        color: var(--accent-light);
    }
    .login-title {
        font-size: 1.8rem;
        font-weight: 900;
        background: linear-gradient(135deg, #fff 0%, #d8c9ff 50%, #a78bfa 100%);
        background-size: 200% 200%;
        animation: gradientFlow 8s ease infinite;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 0.5rem;
        letter-spacing: -0.03em;
    }
    .login-subtitle {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin: 0;
        font-weight: 500;
    }

    /* Alert */
    .login-alert {
        padding: 0.9rem 1.2rem;
        border-radius: 1rem;
        margin-bottom: 1.5rem;
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        animation: shake 0.5s ease;
    }
    .login-alert.error {
        background: rgba(239,68,68,0.08);
        border: 1px solid rgba(239,68,68,0.2);
        color: #fca5a5;
    }

    /* Welcome */
    .login-welcome {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 1rem 1.2rem;
        border-radius: var(--radius-item);
        background: rgba(139,92,246,0.05);
        border: 1px solid rgba(139,92,246,0.1);
        margin-bottom: 1.8rem;
    }
    .login-welcome-icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: rgba(139,92,246,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 1.1rem;
    }
    .login-welcome-text {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.4;
    }
    .login-welcome-text strong {
        color: var(--accent-light);
    }

    /* Form */
    .login-form {
        display: flex;
        flex-direction: column;
        gap: 1.3rem;
    }
    .login-form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .login-form-group label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-dim);
        font-weight: 700;
        margin-left: 0.4rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }
    .login-form-group label i {
        font-size: 0.7rem;
        color: var(--accent-light);
    }
    .login-input {
        padding: 0.9rem 1.3rem;
        border-radius: 1.2rem;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        color: #fff;
        font-size: 0.92rem;
        outline: none;
        transition: all var(--transition);
        font-family: inherit;
        letter-spacing: -0.01em;
        width: 100%;
        box-sizing: border-box;
    }
    .login-input::placeholder {
        color: var(--text-dim);
    }
    .login-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(139,92,246,0.1);
        background: rgba(139,92,246,0.04);
    }
    .login-input.error {
        border-color: var(--danger);
        box-shadow: 0 0 0 4px rgba(239,68,68,0.08);
    }

    /* Submit */
    .login-btn {
        width: 100%;
        padding: 0.95rem;
        border-radius: 100px;
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        color: #fff;
        border: none;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: all var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
        letter-spacing: -0.01em;
        box-shadow: 0 8px 20px rgba(139,92,246,0.25);
    }
    .login-btn:hover {
        background: #7c3aed;
        box-shadow: 0 14px 30px rgba(139,92,246,0.4);
        transform: translateY(-2px);
    }
    .login-btn:active {
        transform: translateY(0);
    }
    .login-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    /* Divider */
    .login-divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 1.5rem 0;
    }
    .login-divider::before,
    .login-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(255,255,255,0.06);
    }
    .login-divider span {
        font-size: 0.72rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
    }

    /* QR */
    .qr-login-btn {
        width: 100%;
        padding: 0.85rem;
        border-radius: 100px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(139,92,246,0.2);
        color: var(--accent-light);
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-decoration: none;
        transition: all var(--transition);
    }
    .qr-login-btn:hover {
        background: rgba(139,92,246,0.08);
        border-color: var(--accent);
        color: #fff;
        transform: translateY(-1px);
    }

    /* Links */
    .login-links {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
        margin-top: 1.5rem;
    }
    .login-link {
        font-size: 0.85rem;
        color: var(--text-secondary);
    }
    .login-link a {
        color: var(--accent-light);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
    }
    .login-link a:hover { color: #fff; }

    .login-forgot {
        font-size: 0.82rem;
        color: var(--text-dim);
        text-decoration: none;
        border-bottom: 1px dashed rgba(255,255,255,0.1);
        padding-bottom: 2px;
        transition: all 0.2s;
        font-weight: 500;
    }
    .login-forgot:hover {
        color: var(--accent-light);
        border-color: var(--accent-light);
    }

    @media (max-width: 500px) {
        .login-card { padding: 2.5rem 1.5rem; border-radius: 2rem; }
        .login-title { font-size: 1.5rem; }
    }
</style>

<section class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h1 class="login-title">Вход</h1>
            <p class="login-subtitle">Добро пожаловать обратно!</p>
        </div>

        {{if .Error}}
            <div class="login-alert error">
                <i class="fa-solid fa-circle-exclamation"></i> {{.Error}}
            </div>
        {{end}}

        <div class="login-welcome">
            <div class="login-welcome-icon">
                <i class="fa-solid fa-hand-sparkles" style="color:#a78bfa;"></i>
            </div>
            <div class="login-welcome-text">
                <strong>С возвращением!</strong><br>
                Войдите чтобы продолжить пользоваться платформой
            </div>
        </div>

        <form method="POST" action="/login" class="login-form" id="loginForm" onsubmit="return handleLogin()">
            <!-- Защита -->
            <input type="hidden" name="csrf_token" value="{{.csrf}}">
            <input type="text" name="website" style="display:none;position:absolute;left:-9999px;" tabindex="-1" autocomplete="off">
            <input type="text" name="name" style="display:none;position:absolute;left:-9999px;" tabindex="-1" autocomplete="off">
            <div style="display:none;position:absolute;left:-9999px;">
                <input type="text" name="email_confirm" tabindex="-1" autocomplete="off">
            </div>

            <div class="login-form-group">
                <label><i class="fa-solid fa-user"></i> Имя пользователя или Email</label>
                <input 
                    type="text" 
                    name="username" 
                    class="login-input" 
                    id="username"
                    required 
                    placeholder="login/email@gmail.com" 
                    autocomplete="username"
                >
            </div>
            <div class="login-form-group">
                <label><i class="fa-solid fa-lock"></i> Пароль</label>
                <input 
                    type="password" 
                    name="password" 
                    class="login-input" 
                    id="password"
                    required 
                    placeholder="Ваш пароль" 
                    autocomplete="current-password"
                >
            </div>
            <button type="submit" class="login-btn" id="submitBtn">
                <i class="fa-solid fa-rocket"></i> Войти
            </button>
        </form>

        <div class="login-divider">
            <span>или</span>
        </div>

        <a href="/qr-login" class="qr-login-btn">
            <i class="fa-solid fa-qrcode"></i> Войти по QR-коду
        </a>

        <div class="login-links">
            <a href="/forgot-password" class="login-forgot">
                <i class="fa-solid fa-circle-question"></i> Забыли пароль?
            </a>
            <p class="login-link">
                Нет аккаунта? <a href="/register">Зарегистрируйтесь <i class="fa-solid fa-arrow-right"></i></a>
            </p>
        </div>
    </div>
</section>
{{end}}
