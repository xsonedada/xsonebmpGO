{{define "sessions"}}
<style>
    :root {
        --bg-deep: #08081c;
        --surface: rgba(18,18,44,0.75);
        --border: rgba(255,255,255,0.06);
        --border-hover: rgba(255,255,255,0.12);
        --text-primary: #f1f1f9;
        --text-secondary: rgba(255,255,255,0.45);
        --text-dim: rgba(255,255,255,0.25);
        --accent: #8b5cf6;
        --accent-light: #c084fc;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --radius-card: 2.25rem;
        --radius-item: 1.25rem;
        --transition: 0.25s cubic-bezier(0.33, 1, 0.68, 1);
    }

    @keyframes subtleShimmer {
        0% { background-position: -200% 50%; }
        100% { background-position: 200% 50%; }
    }

    body {
        background: radial-gradient(ellipse at 50% 0%, #15153a 0%, #08081c 70%);
        background-attachment: fixed;
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-primary);
        letter-spacing: -0.01em;
        min-height: 100vh;
    }

    .sessions-page {
        max-width: 720px;
        margin: 0 auto;
        padding: 5rem 1.5rem 4rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .sessions-back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        transition: color 0.2s;
        width: fit-content;
    }
    .sessions-back:hover { color: var(--accent-light); }

    .sessions-card {
        background: var(--surface);
        backdrop-filter: blur(40px) saturate(140%);
        -webkit-backdrop-filter: blur(40px) saturate(140%);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 2.5rem;
        box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
        position: relative;
        overflow: hidden;
        transition: border-color var(--transition), box-shadow var(--transition);
    }
    .sessions-card:hover {
        border-color: var(--border-hover);
        box-shadow: 0 24px 48px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(139,92,246,0.08), inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    .sessions-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, 
            transparent 45%, 
            rgba(255,255,255,0.02) 50%, 
            transparent 55%);
        background-size: 200% 100%;
        animation: subtleShimmer 20s infinite; /* Очень медленное сияние */
        pointer-events: none;
    }
    .sessions-card > * { position: relative; z-index: 1; }

    .sessions-header {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        margin-bottom: 2rem;
    }
    .sessions-icon {
        width: 46px; height: 46px;
        border-radius: 14px;
        background: rgba(139,92,246,0.1);
        border: 1px solid rgba(139,92,246,0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent-light);
        font-size: 1rem;
        flex-shrink: 0;
    }
    .sessions-title {
        font-size: 1.2rem;
        font-weight: 800;
        color: #fff;
        letter-spacing: -0.02em;
    }

    .session-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.2rem 0;
        border-bottom: 1px solid rgba(255,255,255,0.04);
        gap: 1rem;
        transition: background var(--transition), transform var(--transition);
        border-radius: 0.8rem;
        margin: 0 -0.5rem;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
    }
    .session-item:last-child { border-bottom: none; }
    .session-item:hover {
        background: rgba(139,92,246,0.04);
        transform: translateX(6px);
    }

    .session-info { flex: 1; min-width: 0; }
    .session-location {
        font-weight: 600;
        color: #f1f1f9;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }
    .session-location i { color: var(--accent-light); font-size: 0.75rem; }
    .session-meta {
        color: var(--text-secondary);
        font-size: 0.75rem;
        margin-top: 0.2rem;
    }

    .session-badge {
        padding: 0.3rem 0.9rem;
        border-radius: 100px;
        font-size: 0.7rem;
        font-weight: 600;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        background: rgba(16,185,129,0.08);
        border: 1px solid rgba(16,185,129,0.2);
        color: #6ee7b7;
    }
    .session-badge .dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #10b981;
        display: inline-block;
        box-shadow: 0 0 8px #10b981;
    }

    .session-revoke {
        padding: 0.5rem 1.2rem;
        border-radius: 100px;
        font-size: 0.72rem;
        font-weight: 600;
        background: transparent;
        border: 1px solid rgba(239,68,68,0.2);
        color: #f87171;
        cursor: pointer;
        white-space: nowrap;
        transition: all var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
    }
    .session-revoke:hover {
        background: rgba(239,68,68,0.1);
        border-color: rgba(239,68,68,0.4);
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(239,68,68,0.15);
    }

    .sessions-empty {
        text-align: center;
        padding: 3rem 2rem;
        color: var(--text-dim);
    }
    .sessions-empty i {
        font-size: 2.8rem;
        display: block;
        margin-bottom: 0.8rem;
        opacity: 0.3;
    }

    @media (max-width: 480px) {
        .sessions-card { padding: 1.5rem; }
        .session-item { flex-wrap: wrap; }
        .session-revoke { width: 100%; text-align: center; justify-content: center; }
        .sessions-page { padding: 3rem 1rem 3rem; }
    }
</style>

<section class="sessions-page">
    <a href="/profile" class="sessions-back"><i class="fa-solid fa-arrow-left"></i> Назад в профиль</a>

    <div class="sessions-card">
        <div class="sessions-header">
            <div class="sessions-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h2 class="sessions-title">Активные сессии</h2>
        </div>

        {{if .Sessions}}
        {{range .Sessions}}
        <div class="session-item">
            <div class="session-info">
                <div class="session-location">
                    <i class="fa-solid fa-location-dot"></i> {{.Device}} • {{.Location}}
                </div>
                <div class="session-meta">
                    IP: {{.IP}} • {{.LastSeen.Format "02.01.2006 15:04"}}
                </div>
            </div>
            {{if eq .SessionToken $.CurrentSessionUUID}}
                <span class="session-badge"><span class="dot"></span> Сейчас</span>
            {{else}}
                <form method="POST" action="/sessions/revoke/{{.ID}}" onsubmit="return confirm('Завершить эту сессию?')">
                    <button class="session-revoke"><i class="fa-solid fa-xmark"></i> Завершить</button>
                </form>
            {{end}}
        </div>
        {{end}}
        {{else}}
        <div class="sessions-empty">
            <i class="fa-solid fa-shield-halved"></i>
            <p>Нет активных сессий</p>
        </div>
        {{end}}
    </div>
</section>
{{end}}
