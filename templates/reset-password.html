{{define "reset-password"}}
<style>
    :root {
        --bg-deep: #08081c;
        --surface: rgba(18,18,44,0.75);
        --border: rgba(255,255,255,0.06);
        --border-hover: rgba(255,255,255,0.12);
        --text-primary: #f1f1f9;
        --text-secondary: rgba(255,255,255,0.45);
        --text-dim: rgba(255,255,255,0.25);
        --accent: #8b5cf6;
        --accent-light: #c084fc;
        --success: #10b981;
        --danger: #ef4444;
        --radius-card: 2.25rem;
        --radius-item: 1.25rem;
        --transition: 0.25s cubic-bezier(0.33, 1, 0.68, 1);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(28px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes subtleShimmer {
        0% { background-position: -200% 50%; }
        100% { background-position: 200% 50%; }
    }
    @keyframes gradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
    }

    body {
        background: radial-gradient(ellipse at 50% 0%, #15153a 0%, #08081c 70%);
        background-attachment: fixed;
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-primary);
        letter-spacing: -0.01em;
        min-height: 100vh;
    }

    .reset-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5rem 1.5rem 3rem;
    }

    .reset-card {
        width: 100%;
        max-width: 460px;
        background: var(--surface);
        backdrop-filter: blur(45px) saturate(140%);
        -webkit-backdrop-filter: blur(45px) saturate(140%);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 3rem 2.5rem;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.5s ease;
        transition: border-color var(--transition), box-shadow var(--transition);
        box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    .reset-card:hover {
        border-color: var(--border-hover);
        box-shadow: 0 24px 48px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(139,92,246,0.08);
    }
    .reset-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, 
            transparent 45%, 
            rgba(255,255,255,0.02) 50%, 
            transparent 55%);
        background-size: 200% 100%;
        animation: subtleShimmer 20s infinite;
        pointer-events: none;
    }
    .reset-card > * { position: relative; z-index: 1; }

    /* Header */
    .reset-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .reset-icon {
        width: 60px;
        height: 60px;
        border-radius: 20px;
        background: rgba(16,185,129,0.1);
        border: 1px solid rgba(16,185,129,0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.2rem;
        animation: float 3s ease-in-out infinite;
    }
    .reset-icon i {
        font-size: 1.6rem;
        color: #6ee7b7;
    }
    .reset-title {
        font-size: 1.8rem;
        font-weight: 900;
        background: linear-gradient(135deg, #fff 0%, #d8c9ff 50%, #a78bfa 100%);
        background-size: 200% 200%;
        animation: gradientFlow 8s ease infinite;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 0.5rem;
        letter-spacing: -0.03em;
    }
    .reset-subtitle {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin: 0;
        font-weight: 500;
    }

    /* Steps */
    .reset-steps {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        margin-bottom: 2rem;
    }
    .reset-step {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(16,185,129,0.2);
        border: 2px solid rgba(16,185,129,0.3);
        transition: all var(--transition);
    }
    .reset-step.active {
        background: var(--success);
        border-color: var(--success);
        box-shadow: 0 0 12px rgba(16,185,129,0.5);
    }
    .reset-step.completed {
        background: var(--success);
        border-color: var(--success);
    }
    .reset-step-line {
        width: 28px;
        height: 2px;
        background: rgba(255,255,255,0.06);
        border-radius: 2px;
        transition: all var(--transition);
    }
    .reset-step-line.completed {
        background: rgba(16,185,129,0.3);
    }

    /* Alert */
    .reset-alert {
        padding: 0.9rem 1.2rem;
        border-radius: 1rem;
        margin-bottom: 1.5rem;
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        animation: shake 0.5s ease;
    }
    .reset-alert.error {
        background: rgba(239,68,68,0.08);
        border: 1px solid rgba(239,68,68,0.2);
        color: #fca5a5;
    }

    /* Info */
    .reset-info {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 1rem 1.2rem;
        border-radius: var(--radius-item);
        background: rgba(16,185,129,0.05);
        border: 1px solid rgba(16,185,129,0.12);
        margin-bottom: 1.8rem;
    }
    .reset-info-icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: rgba(16,185,129,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 1rem;
    }
    .reset-info-text {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.4;
    }
    .reset-info-text strong {
        color: #6ee7b7;
    }

    /* Form */
    .reset-form {
        display: flex;
        flex-direction: column;
        gap: 1.3rem;
    }
    .reset-form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .reset-form-group label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-dim);
        font-weight: 700;
        margin-left: 0.4rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }
    .reset-form-group label i {
        font-size: 0.7rem;
        color: #6ee7b7;
    }
    .reset-input {
        padding: 0.9rem 1.3rem;
        border-radius: 1.2rem;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        color: #fff;
        font-size: 0.92rem;
        outline: none;
        transition: all var(--transition);
        font-family: inherit;
        letter-spacing: -0.01em;
        width: 100%;
        box-sizing: border-box;
    }
    .reset-input::placeholder {
        color: var(--text-dim);
    }
    .reset-input:focus {
        border-color: var(--success);
        box-shadow: 0 0 0 4px rgba(16,185,129,0.1);
        background: rgba(16,185,129,0.04);
    }
    .reset-input.code {
        letter-spacing: 8px;
        text-align: center;
        font-size: 1.2rem;
        font-weight: 700;
        font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .reset-input.error {
        border-color: var(--danger);
        box-shadow: 0 0 0 4px rgba(239,68,68,0.08);
    }
    .reset-input.valid {
        border-color: var(--success);
    }

    /* Password strength */
    .password-strength {
        display: flex;
        gap: 4px;
        margin-top: 0.3rem;
    }
    .password-strength-bar {
        flex: 1;
        height: 4px;
        border-radius: 4px;
        background: rgba(255,255,255,0.06);
        transition: background var(--transition);
    }
    .password-strength-bar.active.weak { background: #ef4444; }
    .password-strength-bar.active.medium { background: #f59e0b; }
    .password-strength-bar.active.strong { background: #10b981; }
    .password-strength-text {
        font-size: 0.68rem;
        color: var(--text-dim);
        margin-top: 0.2rem;
        font-weight: 500;
    }

    /* Submit */
    .reset-btn {
        width: 100%;
        padding: 0.95rem;
        border-radius: 100px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
        border: none;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: all var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
        letter-spacing: -0.01em;
        box-shadow: 0 8px 20px rgba(16,185,129,0.25);
    }
    .reset-btn:hover {
        background: linear-gradient(135deg, #059669, #047857);
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(16,185,129,0.4);
    }
    .reset-btn:active {
        transform: translateY(0);
    }
    .reset-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    /* Back */
    .reset-back {
        text-align: center;
        margin-top: 1.5rem;
    }
    .reset-back a {
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        transition: color 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
    }
    .reset-back a:hover { color: var(--accent-light); }

    @media (max-width: 500px) {
        .reset-card { padding: 2.5rem 1.5rem; border-radius: 2rem; }
        .reset-title { font-size: 1.5rem; }
    }
</style>

<section class="reset-page">
    <div class="reset-card">
        <div class="reset-header">
            <div class="reset-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="reset-title">Новый пароль</h1>
            <p class="reset-subtitle">Придумайте новый пароль для вашего аккаунта</p>
        </div>

        <!-- Индикатор шагов -->
        <div class="reset-steps">
            <div class="reset-step completed"></div>
            <div class="reset-step-line completed"></div>
            <div class="reset-step completed"></div>
            <div class="reset-step-line completed"></div>
            <div class="reset-step active"></div>
        </div>

        {{if .Error}}
            <div class="reset-alert error">
                <i class="fa-solid fa-circle-exclamation"></i> {{.Error}}
            </div>
        {{end}}

        <div class="reset-info">
            <div class="reset-info-icon">
                <i class="fa-solid fa-circle-check" style="color:#10b981;"></i>
            </div>
            <div class="reset-info-text">
                <strong>Последний шаг!</strong><br>
                Введите данные из письма и новый пароль
            </div>
        </div>

        <form method="POST" action="/reset-password" class="reset-form" id="resetForm" onsubmit="return handleSubmit()">
            <div class="reset-form-group">
                <label><i class="fa-solid fa-envelope"></i> Email</label>
                <input 
                    type="email" 
                    name="email" 
                    required 
                    placeholder="your@email.com" 
                    class="reset-input" 
                    id="email"
                    autocomplete="email"
                >
            </div>
            <div class="reset-form-group">
                <label><i class="fa-solid fa-key"></i> Код из письма</label>
                <input 
                    type="text" 
                    name="code" 
                    required 
                    placeholder="000000" 
                    maxlength="6" 
                    class="reset-input code" 
                    id="code"
                    autocomplete="off"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)"
                >
            </div>
            <div class="reset-form-group">
                <label><i class="fa-solid fa-lock"></i> Новый пароль</label>
                <input 
                    type="password" 
                    name="password" 
                    required 
                    placeholder="Минимум 8 символов, буквы и цифры" 
                    minlength="8" 
                    class="reset-input" 
                    id="password"
                    autocomplete="new-password"
                    oninput="checkPasswordStrength()"
                >
                <div class="password-strength" id="strengthBars">
                    <div class="password-strength-bar"></div>
                    <div class="password-strength-bar"></div>
                    <div class="password-strength-bar"></div>
                    <div class="password-strength-bar"></div>
                </div>
                <div class="password-strength-text" id="strengthText"></div>
            </div>
            <button type="submit" class="reset-btn" id="submitBtn">
                <i class="fa-solid fa-check-circle"></i> Сменить пароль
            </button>
        </form>

        <div class="reset-back">
            <a href="/login">
                <i class="fa-solid fa-arrow-left"></i> Вернуться ко входу
            </a>
        </div>
    </div>
</section>
{{end}}
