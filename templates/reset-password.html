{{define "reset-password"}}
<style>
    @keyframes fadeSlide {
        from { opacity: 0; transform: translateY(25px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
    }
    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .reset-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6rem 1.5rem 3rem;
    }

    .reset-card {
        width: 100%;
        max-width: 440px;
        background: rgba(14,14,38,0.8);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255,255,255,0.04);
        border-radius: 2.5rem;
        padding: 3rem 2.5rem;
        position: relative;
        overflow: hidden;
        animation: fadeSlide 0.55s cubic-bezier(0.16,1,0.3,1);
    }
    .reset-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent, rgba(255,255,255,0.02), transparent);
        animation: shimmer 5s infinite;
        pointer-events: none;
    }
    .reset-card > * {
        position: relative;
        z-index: 1;
    }

    .reset-title {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 50%, #a78bfa 100%);
        background-size: 300% 300%;
        animation: gradientShift 6s ease infinite;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0 0 0.5rem;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }
    .reset-title i {
        font-size: 1.6rem;
        -webkit-text-fill-color: #a78bfa;
    }

    .reset-subtitle {
        text-align: center;
        color: rgba(255,255,255,0.4);
        font-size: 0.9rem;
        margin: 0 0 2rem;
        line-height: 1.5;
    }

    .reset-alert {
        padding: 0.9rem 1.2rem;
        border-radius: 1rem;
        margin-bottom: 1.5rem;
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .reset-alert.error {
        background: rgba(239,68,68,0.1);
        border: 1px solid rgba(239,68,68,0.2);
        color: #fca5a5;
    }

    .reset-form {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
    }

    .reset-form-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
    }
    .reset-form-group label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: rgba(255,255,255,0.35);
        font-weight: 600;
        margin-left: 0.3rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }
    .reset-form-group label i {
        font-size: 0.65rem;
    }
    .reset-input {
        padding: 0.85rem 1.2rem;
        border-radius: 1rem;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        color: #fff;
        font-size: 0.9rem;
        outline: none;
        transition: all 0.2s;
        width: 100%;
        box-sizing: border-box;
    }
    .reset-input::placeholder {
        color: rgba(255,255,255,0.2);
    }
    .reset-input:focus {
        border-color: #8b5cf6;
        box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
        background: rgba(255,255,255,0.05);
    }
    .reset-input.code {
        letter-spacing: 6px;
        text-align: center;
        font-size: 1.1rem;
        font-weight: 700;
        font-family: 'Courier New', monospace;
    }

    .reset-btn {
        width: 100%;
        padding: 0.9rem;
        border-radius: 100px;
        background: linear-gradient(135deg, #10b981, #34d399);
        color: #fff;
        border: none;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
    }
    .reset-btn:hover {
        background: linear-gradient(135deg, #059669, #10b981);
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(16,185,129,0.35);
    }
    .reset-btn:active {
        transform: translateY(0);
    }

    .reset-steps {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 2rem;
    }
    .reset-step {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.1);
        transition: all 0.3s;
    }
    .reset-step.active {
        background: #10b981;
        box-shadow: 0 0 10px rgba(16,185,129,0.5);
        width: 10px;
        height: 10px;
    }
    .reset-step-line {
        width: 24px;
        height: 1px;
        background: rgba(255,255,255,0.08);
    }

    .reset-back {
        text-align: center;
        margin-top: 1.5rem;
    }
    .reset-back a {
        color: rgba(255,255,255,0.4);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
        transition: color 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
    }
    .reset-back a:hover {
        color: #a78bfa;
    }

    .reset-info {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 1rem 1.2rem;
        border-radius: 1rem;
        background: rgba(16,185,129,0.06);
        border: 1px solid rgba(16,185,129,0.1);
        margin-bottom: 1.5rem;
    }
    .reset-info-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: rgba(16,185,129,0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 1rem;
    }
    .reset-info-text {
        font-size: 0.82rem;
        color: rgba(255,255,255,0.5);
        line-height: 1.4;
    }
    .reset-info-text strong {
        color: #34d399;
    }
</style>

<section class="reset-page">
    <div class="reset-card">
        <h1 class="reset-title">
            <i class="fa-solid fa-lock"></i> Новый пароль
        </h1>
        <p class="reset-subtitle">Придумайте новый пароль для вашего аккаунта</p>

        <!-- Индикатор шагов -->
        <div class="reset-steps">
            <div class="reset-step active"></div>
            <div class="reset-step-line"></div>
            <div class="reset-step active"></div>
            <div class="reset-step-line"></div>
            <div class="reset-step active"></div>
        </div>
        
        {{if .Error}}
            <div class="reset-alert error">
                <i class="fa-solid fa-circle-exclamation"></i> {{.Error}}
            </div>
        {{end}}

        <div class="reset-info">
            <div class="reset-info-icon">
                <i class="fa-solid fa-circle-check" style="color:#10b981;"></i>
            </div>
            <div class="reset-info-text">
                <strong>Последний шаг!</strong><br>
                Введите данные из письма и новый пароль
            </div>
        </div>
        
        <form method="POST" action="/reset-password" class="reset-form">
            <div class="reset-form-group">
                <label><i class="fa-solid fa-envelope"></i> Email</label>
                <input type="email" name="email" required placeholder="your@email.com" class="reset-input" autocomplete="email">
            </div>
            <div class="reset-form-group">
                <label><i class="fa-solid fa-key"></i> Код из письма</label>
                <input type="text" name="code" required placeholder="000000" maxlength="6" class="reset-input code" autocomplete="off">
            </div>
            <div class="reset-form-group">
                <label><i class="fa-solid fa-lock"></i> Новый пароль</label>
                <input type="password" name="password" required placeholder="Минимум 6 символов" minlength="6" class="reset-input" autocomplete="new-password">
            </div>
            <button type="submit" class="reset-btn">
                <i class="fa-solid fa-check-circle"></i> Сменить пароль
            </button>
        </form>
        
        <div class="reset-back">
            <a href="/login">
                <i class="fa-solid fa-arrow-left"></i> Вернуться ко входу
            </a>
        </div>
    </div>
</section>
{{end}}
