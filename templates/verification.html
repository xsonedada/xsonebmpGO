{{define "verification"}}
<style>
    :root {
        --bg-deep: #08081c;
        --surface: rgba(18,18,44,0.75);
        --border: rgba(255,255,255,0.06);
        --border-hover: rgba(255,255,255,0.12);
        --text-primary: #f1f1f9;
        --text-secondary: rgba(255,255,255,0.45);
        --text-dim: rgba(255,255,255,0.25);
        --accent: #8b5cf6;
        --accent-light: #c084fc;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --gold: #fbbf24;
        --info: #60a5fa;
        --radius-card: 2.25rem;
        --radius-item: 1.25rem;
        --transition: 0.25s cubic-bezier(0.33, 1, 0.68, 1);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(28px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes subtleShimmer {
        0% { background-position: -200% 50%; }
        100% { background-position: 200% 50%; }
    }
    @keyframes gradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }
    @keyframes pulseGreen {
        0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); }
        50% { box-shadow: 0 0 0 15px rgba(16,185,129,0); }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
    }

    body {
        background: radial-gradient(ellipse at 50% 0%, #15153a 0%, #08081c 70%);
        background-attachment: fixed;
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-primary);
        letter-spacing: -0.01em;
        min-height: 100vh;
    }

    .ver-page {
        max-width: 640px;
        margin: 0 auto;
        padding: 5rem 1.5rem 4rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .ver-back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        transition: color 0.2s;
        width: fit-content;
    }
    .ver-back:hover { color: var(--success); }

    .ver-card {
        background: var(--surface);
        backdrop-filter: blur(45px) saturate(140%);
        -webkit-backdrop-filter: blur(45px) saturate(140%);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 2.5rem;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.5s ease;
        transition: border-color var(--transition), box-shadow var(--transition);
        box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    .ver-card:hover {
        border-color: var(--border-hover);
        box-shadow: 0 24px 48px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(16,185,129,0.1);
    }
    .ver-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, 
            transparent 45%, 
            rgba(255,255,255,0.02) 50%, 
            transparent 55%);
        background-size: 200% 100%;
        animation: subtleShimmer 20s infinite;
        pointer-events: none;
    }
    .ver-card > * { position: relative; z-index: 1; }

    /* Status block */
    .ver-status {
        text-align: center;
        padding: 1.5rem 0;
    }
    .ver-status-icon {
        width: 80px; height: 80px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 2.2rem;
        animation: pulseGreen 3s infinite;
        background: rgba(245,158,11,0.1);
        border: 1px solid rgba(245,158,11,0.2);
    }
    .ver-status-icon i { color: #fcd34d; }
    .ver-status h2 {
        margin: 0 0 0.5rem;
        font-size: 1.4rem;
        font-weight: 800;
        color: #fcd34d;
    }
    .ver-status p {
        color: var(--text-secondary);
        font-size: 0.95rem;
        margin: 0;
    }
    .ver-status-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.5rem;
        padding: 0.7rem 1.6rem;
        border-radius: 100px;
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.88rem;
        font-weight: 600;
        transition: all var(--transition);
    }
    .ver-status-btn:hover {
        color: #fff;
        border-color: rgba(255,255,255,0.25);
        background: rgba(255,255,255,0.03);
    }

    /* Form header */
    .ver-hero {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
    }
    .ver-hero-icon {
        width: 54px; height: 54px;
        border-radius: 18px;
        background: rgba(16,185,129,0.1);
        border: 1px solid rgba(16,185,129,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        animation: float 3s ease-in-out infinite;
    }
    .ver-hero-icon i { color: #6ee7b7; font-size: 1.4rem; }
    .ver-hero h1 {
        font-size: 1.8rem;
        font-weight: 900;
        background: linear-gradient(135deg, #fff 0%, #a7f3d0 50%, #6ee7b7 100%);
        background-size: 200% 200%;
        animation: gradientFlow 8s ease infinite;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 0.2rem;
        letter-spacing: -0.03em;
    }
    .ver-hero p {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin: 0;
        font-weight: 500;
    }

    /* Form */
    .ver-form {
        display: flex;
        flex-direction: column;
        gap: 1.3rem;
    }
    .ver-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .ver-label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-dim);
        font-weight: 700;
        margin-left: 0.4rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }
    .ver-label i {
        font-size: 0.7rem;
        color: #6ee7b7;
    }
    .ver-input,
    .ver-textarea {
        padding: 0.9rem 1.3rem;
        border-radius: 1.2rem;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        color: #fff;
        font-size: 0.92rem;
        outline: none;
        transition: all var(--transition);
        font-family: inherit;
        width: 100%;
        box-sizing: border-box;
        letter-spacing: -0.01em;
    }
    .ver-input:focus,
    .ver-textarea:focus {
        border-color: var(--success);
        box-shadow: 0 0 0 4px rgba(16,185,129,0.1);
        background: rgba(16,185,129,0.04);
    }
    .ver-input::placeholder,
    .ver-textarea::placeholder {
        color: var(--text-dim);
    }
    .ver-input.error,
    .ver-textarea.error {
        border-color: var(--danger);
        box-shadow: 0 0 0 4px rgba(239,68,68,0.08);
    }
    .ver-textarea {
        resize: vertical;
        min-height: 120px;
        line-height: 1.6;
    }

    .ver-submit {
        padding: 0.95rem;
        border-radius: 100px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
        border: none;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        box-shadow: 0 8px 20px rgba(16,185,129,0.25);
        letter-spacing: -0.01em;
    }
    .ver-submit:hover {
        background: linear-gradient(135deg, #059669, #047857);
        box-shadow: 0 14px 30px rgba(16,185,129,0.4);
        transform: translateY(-2px);
    }
    .ver-submit:active {
        transform: translateY(0);
    }
    .ver-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    @media (max-width: 500px) {
        .ver-card { padding: 2rem 1.5rem; border-radius: 2rem; }
        .ver-hero h1 { font-size: 1.5rem; }
    }
</style>

<section class="ver-page">
    <a href="/profile" class="ver-back"><i class="fa-solid fa-arrow-left"></i> Назад в профиль</a>

    <div class="ver-card">
        {{if .Data.HasPending}}
        <!-- Статус ожидания -->
        <div class="ver-status">
            <div class="ver-status-icon">
                <i class="fa-solid fa-clock"></i>
            </div>
            <h2>Заявка на рассмотрении</h2>
            <p>Ожидайте решения администратора</p>
            <a href="/profile" class="ver-status-btn">
                <i class="fa-solid fa-arrow-left"></i> Вернуться в профиль
            </a>
        </div>
        {{else}}
        <!-- Форма подачи заявки -->
        <div class="ver-hero">
            <div class="ver-hero-icon">
                <i class="fa-solid fa-certificate"></i>
            </div>
            <div>
                <h1>Верификация</h1>
                <p>Станьте проверенным продавцом</p>
            </div>
        </div>

        <form method="POST" action="/verification/apply" class="ver-form" id="verForm" onsubmit="return handleVerSubmit()">
            <!-- Защита -->
            <input type="hidden" name="csrf_token" value="{{.csrf}}">
            <input type="text" name="website" style="display:none;position:absolute;left:-9999px;" tabindex="-1" autocomplete="off">
            <input type="text" name="name" style="display:none;position:absolute;left:-9999px;" tabindex="-1" autocomplete="off">
            <div style="display:none;position:absolute;left:-9999px;">
                <input type="text" name="email_confirm" tabindex="-1" autocomplete="off">
            </div>

            <div class="ver-group">
                <label class="ver-label"><i class="fa-solid fa-user"></i> Полное имя</label>
                <input type="text" name="full_name" id="fullName" placeholder="Иванов Иван Иванович" required class="ver-input">
            </div>
            <div class="ver-group">
                <label class="ver-label"><i class="fa-solid fa-align-left"></i> О себе</label>
                <textarea name="description" id="description" placeholder="Расскажите о своём опыте, играх, достижениях..." required class="ver-textarea"></textarea>
            </div>
            <div class="ver-group">
                <label class="ver-label"><i class="fa-solid fa-address-book"></i> Контакт для связи</label>
                <input type="text" name="contact" id="contact" placeholder="Discord: nickname или Telegram: @nickname" required class="ver-input">
            </div>
            <button type="submit" class="ver-submit" id="verSubmitBtn">
                <i class="fa-solid fa-paper-plane"></i> Отправить заявку
            </button>
        </form>
        {{end}}
    </div>
</section>

<script>
function handleVerSubmit() {
    var fullName = document.getElementById('fullName');
    var description = document.getElementById('description');
    var contact = document.getElementById('contact');
    var btn = document.getElementById('verSubmitBtn');
    var valid = true;

    [fullName, description, contact].forEach(function(el) {
        el.classList.remove('error');
        if (!el.value.trim()) {
            el.classList.add('error');
            valid = false;
        }
    });

    if (!valid) return false;

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Отправляем...';

    setTimeout(function() {
        if (btn.disabled) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Отправить заявку';
        }
    }, 10000);
    return true;
}

// Автофокус на первое поле
var firstInput = document.getElementById('fullName');
if (firstInput) firstInput.focus();
</script>
{{end}}
