{{define "qr-login"}}
<style>
    :root {
        --bg-deep: #08081c;
        --surface: rgba(18,18,44,0.75);
        --border: rgba(255,255,255,0.06);
        --border-hover: rgba(255,255,255,0.12);
        --text-primary: #f1f1f9;
        --text-secondary: rgba(255,255,255,0.45);
        --text-dim: rgba(255,255,255,0.25);
        --accent: #8b5cf6;
        --accent-light: #c084fc;
        --success: #10b981;
        --danger: #ef4444;
        --radius-card: 2.25rem;
        --radius-item: 1.25rem;
        --transition: 0.25s cubic-bezier(0.33, 1, 0.68, 1);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(28px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes subtleShimmer {
        0% { background-position: -200% 50%; }
        100% { background-position: 200% 50%; }
    }
    @keyframes gradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }
    @keyframes fadeSlide {
        from { opacity: 0; transform: translateY(15px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    body {
        background: radial-gradient(ellipse at 50% 0%, #15153a 0%, #08081c 70%);
        background-attachment: fixed;
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-primary);
        letter-spacing: -0.01em;
        min-height: 100vh;
    }

    .qr-login-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
    }

    .qr-login-card {
        background: var(--surface);
        backdrop-filter: blur(45px) saturate(140%);
        -webkit-backdrop-filter: blur(45px) saturate(140%);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 3rem 2.5rem;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
        animation: fadeUp 0.5s ease;
        position: relative;
        overflow: hidden;
        transition: border-color var(--transition), box-shadow var(--transition);
    }
    .qr-login-card:hover {
        border-color: rgba(139,92,246,0.2);
        box-shadow: 0 24px 48px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(139,92,246,0.08);
    }
    .qr-login-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, 
            transparent 45%, 
            rgba(255,255,255,0.02) 50%, 
            transparent 55%);
        background-size: 200% 100%;
        animation: subtleShimmer 20s infinite;
        pointer-events: none;
    }
    .qr-login-card > * { position: relative; z-index: 1; }

    .qr-login-icon {
        width: 64px; height: 64px;
        border-radius: 20px;
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 1.7rem;
        color: white;
        box-shadow: 0 8px 24px rgba(139,92,246,0.3);
        animation: float 3s ease-in-out infinite;
    }

    .qr-login-title {
        font-size: 1.9rem;
        font-weight: 900;
        background: linear-gradient(135deg, #fff 0%, #d8c9ff 50%, #a78bfa 100%);
        background-size: 200% 200%;
        animation: gradientFlow 8s ease infinite;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0 0 0.5rem;
        letter-spacing: -0.03em;
    }

    .qr-login-subtitle {
        color: var(--text-secondary);
        font-size: 0.95rem;
        margin: 0 0 2rem;
        font-weight: 500;
    }

    .qr-login-camera {
        width: 100%;
        max-width: 360px;
        margin: 0 auto 1.5rem;
        border-radius: var(--radius-item);
        overflow: hidden;
        background: #0a0a1f;
        border: 1px solid var(--border);
        box-shadow: 0 12px 32px rgba(0,0,0,0.4);
        position: relative;
        aspect-ratio: 4/3;
    }
    .qr-login-camera video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .qr-login-camera-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        color: var(--text-dim);
        font-size: 0.85rem;
        font-weight: 500;
        background: rgba(10,10,31,0.9);
    }
    .qr-login-camera-placeholder i {
        font-size: 2.5rem;
        opacity: 0.3;
    }

    .qr-login-btn {
        width: 100%;
        padding: 0.9rem 1.5rem;
        border-radius: 100px;
        font-weight: 700;
        font-size: 0.92rem;
        cursor: pointer;
        border: none;
        transition: all var(--transition);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        letter-spacing: -0.01em;
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        color: #fff;
        box-shadow: 0 8px 20px rgba(139,92,246,0.25);
        margin-bottom: 1.5rem;
    }
    .qr-login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(139,92,246,0.4);
    }
    .qr-login-btn:active { transform: translateY(0); }
    .qr-login-btn-secondary {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-secondary);
        box-shadow: none;
    }
    .qr-login-btn-secondary:hover {
        border-color: rgba(255,255,255,0.2);
        color: #fff;
        background: rgba(255,255,255,0.03);
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .qr-login-divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 0 0 1.5rem;
        color: var(--text-dim);
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }
    .qr-login-divider::before,
    .qr-login-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(255,255,255,0.06);
    }

    .qr-login-form {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
    }
    .qr-login-input {
        padding: 0.9rem 1.3rem;
        border-radius: 1rem;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        color: #fff;
        font-size: 0.9rem;
        outline: none;
        transition: all var(--transition);
        font-family: 'SF Mono', 'Fira Code', monospace;
        letter-spacing: 0.02em;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
    }
    .qr-login-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(139,92,246,0.1);
        background: rgba(139,92,246,0.04);
    }
    .qr-login-input::placeholder {
        color: var(--text-dim);
    }

    .qr-login-status {
        margin-top: 1rem;
        padding: 0.7rem 1.2rem;
        border-radius: 100px;
        font-size: 0.82rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: rgba(139,92,246,0.06);
        border: 1px solid rgba(139,92,246,0.12);
        color: var(--accent-light);
        transition: all var(--transition);
        animation: fadeSlide 0.3s ease;
    }
    .qr-login-status.error {
        background: rgba(239,68,68,0.08);
        border-color: rgba(239,68,68,0.2);
        color: #fca5a5;
    }
    .qr-login-status:empty {
        display: none;
    }

    @media (max-width: 480px) {
        .qr-login-card { padding: 2.5rem 1.5rem; border-radius: 2rem; }
        .qr-login-title { font-size: 1.6rem; }
    }
</style>

<section class="qr-login-page">
    <div class="qr-login-card">
        <div class="qr-login-icon"><i class="fa-solid fa-qrcode"></i></div>
        <h1 class="qr-login-title">Вход по QR</h1>
        <p class="qr-login-subtitle">Наведите камеру на экран компьютера</p>

        <div class="qr-login-camera" id="cameraContainer">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" hidden></canvas>
            <div class="qr-login-camera-placeholder" id="cameraPlaceholder">
                <i class="fa-solid fa-camera"></i>
                <span>Нажмите кнопку ниже, чтобы открыть камеру</span>
            </div>
        </div>

        <button class="qr-login-btn" id="startScanBtn">
            <i class="fa-solid fa-qrcode"></i> Сканировать QR-код
        </button>

        <div class="qr-login-divider"><span>или введите код вручную</span></div>

        <form class="qr-login-form" method="POST" action="/qr/confirm" onsubmit="return submitToken()">
            <input type="text" name="token" class="qr-login-input" placeholder="Токен из QR-кода" autocomplete="off" id="tokenInput">
            <button type="submit" class="qr-login-btn qr-login-btn-secondary">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Войти
            </button>
        </form>

        <div class="qr-login-status" id="statusMessage"></div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" crossorigin="anonymous"></script>
<script>
(function() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const canvasCtx = canvas.getContext('2d');
    const startBtn = document.getElementById('startScanBtn');
    const statusDiv = document.getElementById('statusMessage');
    const cameraPlaceholder = document.getElementById('cameraPlaceholder');
    let scanning = false;
    let stream = null;

    function setStatus(text, isError = false) {
        statusDiv.textContent = text;
        statusDiv.className = 'qr-login-status' + (isError ? ' error' : '');
    }

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
        video.srcObject = null;
        scanning = false;
        cameraPlaceholder.style.display = 'flex';
    }

    function onTokenFound(rawToken) {
        stopCamera();
        setStatus('Код считан! Ожидайте подтверждения на компьютере...');
        
        const pollInterval = setInterval(() => {
            fetch('/qr/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: rawToken, action: 'login' })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    clearInterval(pollInterval);
                    setStatus('Вход выполнен!');
                    setTimeout(() => { window.location.href = data.redirect || '/profile'; }, 500);
                } else if (data.error && data.error !== 'Ожидание подтверждения') {
                    clearInterval(pollInterval);
                    setStatus(data.error, true);
                }
            })
            .catch(() => {
                clearInterval(pollInterval);
                setStatus('Ошибка сети', true);
            });
        }, 2000);
    }

    function scanFrame() {
        if (!scanning) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvasCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvasCtx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code) {
                try {
                    const url = new URL(code.data);
                    const token = url.searchParams.get('token');
                    if (token) {
                        onTokenFound(token);
                        return;
                    }
                } catch(e) {}
            }
        }
        requestAnimationFrame(scanFrame);
    }

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
            cameraPlaceholder.style.display = 'none';
            scanning = true;
            setStatus('Наведите камеру на QR-код', false);
            requestAnimationFrame(scanFrame);
        } catch (err) {
            setStatus('Камера недоступна. Введите код вручную.', true);
        }
    }

    startBtn.addEventListener('click', function() {
        if (scanning) {
            stopCamera();
            startBtn.innerHTML = '<i class="fa-solid fa-qrcode"></i> Сканировать QR-код';
        } else {
            startCamera();
            startBtn.innerHTML = '<i class="fa-solid fa-stop"></i> Остановить сканер';
        }
    });

    window.addEventListener('beforeunload', stopCamera);

    window.submitToken = function() {
        const token = document.getElementById('tokenInput').value.trim();
        if (!token || !/^[a-zA-Z0-9\-_]+$/.test(token)) {
            setStatus('Неверный формат токена', true);
            return false;
        }
        return true;
    };
})();
</script>
{{end}}
