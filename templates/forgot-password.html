{{define "forgot-password"}}
<style>
    :root {
        --bg-deep: #08081c;
        --surface: rgba(18,18,44,0.75);
        --border: rgba(255,255,255,0.06);
        --border-hover: rgba(255,255,255,0.12);
        --text-primary: #f1f1f9;
        --text-secondary: rgba(255,255,255,0.45);
        --text-dim: rgba(255,255,255,0.25);
        --accent: #8b5cf6;
        --accent-light: #c084fc;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --radius-card: 2.25rem;
        --radius-item: 1.25rem;
        --transition: 0.25s cubic-bezier(0.33, 1, 0.68, 1);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(28px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes subtleShimmer {
        0% { background-position: -200% 50%; }
        100% { background-position: 200% 50%; }
    }
    @keyframes gradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
    }
    @keyframes codeReveal {
        from { opacity: 0; transform: scale(0.9); letter-spacing: 20px; }
        to { opacity: 1; transform: scale(1); letter-spacing: 8px; }
    }

    body {
        background: radial-gradient(ellipse at 50% 0%, #15153a 0%, #08081c 70%);
        background-attachment: fixed;
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-primary);
        letter-spacing: -0.01em;
        min-height: 100vh;
    }

    .forgot-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5rem 1.5rem 3rem;
    }

    .forgot-card {
        width: 100%;
        max-width: 460px;
        background: var(--surface);
        backdrop-filter: blur(45px) saturate(140%);
        -webkit-backdrop-filter: blur(45px) saturate(140%);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 3rem 2.5rem;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.5s ease;
        transition: border-color var(--transition), box-shadow var(--transition);
        box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    .forgot-card:hover {
        border-color: var(--border-hover);
        box-shadow: 0 24px 48px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(139,92,246,0.08);
    }
    .forgot-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, 
            transparent 45%, 
            rgba(255,255,255,0.02) 50%, 
            transparent 55%);
        background-size: 200% 100%;
        animation: subtleShimmer 20s infinite;
        pointer-events: none;
    }
    .forgot-card > * { position: relative; z-index: 1; }

    /* Header */
    .forgot-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .forgot-icon {
        width: 60px;
        height: 60px;
        border-radius: 20px;
        background: rgba(139,92,246,0.1);
        border: 1px solid rgba(139,92,246,0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.2rem;
        animation: float 3s ease-in-out infinite;
    }
    .forgot-icon i {
        font-size: 1.6rem;
        color: var(--accent-light);
    }
    .forgot-title {
        font-size: 1.8rem;
        font-weight: 900;
        background: linear-gradient(135deg, #fff 0%, #d8c9ff 50%, #a78bfa 100%);
        background-size: 200% 200%;
        animation: gradientFlow 8s ease infinite;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 0.5rem;
        letter-spacing: -0.03em;
    }
    .forgot-subtitle {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin: 0;
        font-weight: 500;
    }

    /* Alert */
    .forgot-alert {
        padding: 0.9rem 1.2rem;
        border-radius: 1rem;
        margin-bottom: 1.5rem;
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        animation: shake 0.5s ease;
    }
    .forgot-alert.error {
        background: rgba(239,68,68,0.08);
        border: 1px solid rgba(239,68,68,0.2);
        color: #fca5a5;
    }
    .forgot-alert.success {
        background: rgba(16,185,129,0.08);
        border: 1px solid rgba(16,185,129,0.2);
        color: #6ee7b7;
    }

    /* Info */
    .forgot-info {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 1rem 1.2rem;
        border-radius: var(--radius-item);
        background: rgba(245,158,11,0.05);
        border: 1px solid rgba(245,158,11,0.1);
        margin-bottom: 1.8rem;
    }
    .forgot-info-icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: rgba(245,158,11,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 1.1rem;
    }
    .forgot-info-text {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.4;
    }
    .forgot-info-text strong {
        color: #fcd34d;
    }

    /* Form */
    .forgot-form {
        display: flex;
        flex-direction: column;
        gap: 1.3rem;
    }
    .forgot-form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .forgot-form-group label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-dim);
        font-weight: 700;
        margin-left: 0.4rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }
    .forgot-form-group label i {
        font-size: 0.7rem;
        color: var(--accent-light);
    }
    .forgot-input {
        padding: 0.9rem 1.3rem;
        border-radius: 1.2rem;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        color: #fff;
        font-size: 0.92rem;
        outline: none;
        transition: all var(--transition);
        font-family: inherit;
        letter-spacing: -0.01em;
        width: 100%;
        box-sizing: border-box;
    }
    .forgot-input::placeholder {
        color: var(--text-dim);
    }
    .forgot-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(139,92,246,0.1);
        background: rgba(139,92,246,0.04);
    }
    .forgot-input.error {
        border-color: var(--danger);
        box-shadow: 0 0 0 4px rgba(239,68,68,0.08);
    }

    /* Submit */
    .forgot-btn {
        width: 100%;
        padding: 0.95rem;
        border-radius: 100px;
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        color: #fff;
        border: none;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: all var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
        letter-spacing: -0.01em;
        box-shadow: 0 8px 20px rgba(139,92,246,0.25);
        text-decoration: none;
    }
    .forgot-btn:hover {
        background: #7c3aed;
        box-shadow: 0 14px 30px rgba(139,92,246,0.4);
        transform: translateY(-2px);
        color: #fff;
    }
    .forgot-btn:active {
        transform: translateY(0);
    }
    .forgot-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    /* Code block */
    .forgot-code-block {
        text-align: center;
        padding: 2rem 1.5rem;
        background: rgba(139,92,246,0.05);
        border: 1px solid rgba(139,92,246,0.12);
        border-radius: var(--radius-item);
        margin: 1.5rem 0;
    }
    .forgot-code-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
        font-weight: 600;
        margin-bottom: 0.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
    }
    .forgot-code-value {
        font-size: 2.4rem;
        font-weight: 900;
        letter-spacing: 8px;
        color: var(--accent-light);
        animation: codeReveal 0.6s ease;
        font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .forgot-code-hint {
        font-size: 0.8rem;
        color: var(--text-dim);
        margin-top: 0.8rem;
        font-weight: 500;
    }

    /* Back */
    .forgot-back {
        text-align: center;
        margin-top: 1.5rem;
    }
    .forgot-back a {
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        transition: color 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
    }
    .forgot-back a:hover { color: var(--accent-light); }

    @media (max-width: 500px) {
        .forgot-card { padding: 2.5rem 1.5rem; border-radius: 2rem; }
        .forgot-title { font-size: 1.5rem; }
        .forgot-code-value { font-size: 1.8rem; }
    }
</style>

<section class="forgot-page">
    <div class="forgot-card">
        <div class="forgot-header">
            <div class="forgot-icon">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="forgot-title">Восстановление</h1>
            <p class="forgot-subtitle">Восстановите доступ к вашему аккаунту</p>
        </div>

        {{if .Error}}
            <div class="forgot-alert error">
                <i class="fa-solid fa-circle-exclamation"></i> {{.Error}}
            </div>
        {{end}}
        {{if .Success}}
            <div class="forgot-alert success">
                <i class="fa-solid fa-circle-check"></i> {{.Success}}
            </div>
        {{end}}

        <!-- Шаг 1: форма ввода email -->
        <div class="forgot-info">
            <div class="forgot-info-icon">
                <i class="fa-solid fa-envelope" style="color:#fcd34d;"></i>
            </div>
            <div class="forgot-info-text">
                <strong>Восстановление пароля</strong><br>
                Мы отправим код восстановления на вашу почту
            </div>
        </div>

        <form method="POST" action="/forgot-password" class="forgot-form" id="forgotForm" onsubmit="return handleForgot()">
            <!-- Защита -->
            <input type="hidden" name="csrf_token" value="{{.csrf}}">
            <input type="text" name="website" style="display:none;position:absolute;left:-9999px;" tabindex="-1" autocomplete="off">
            <input type="text" name="name" style="display:none;position:absolute;left:-9999px;" tabindex="-1" autocomplete="off">
            <div style="display:none;position:absolute;left:-9999px;">
                <input type="text" name="email_confirm" tabindex="-1" autocomplete="off">
            </div>

            <div class="forgot-form-group">
                <label><i class="fa-solid fa-envelope"></i> Email</label>
                <input 
                    type="email" 
                    name="email" 
                    id="email"
                    required 
                    placeholder="your@email.com" 
                    class="forgot-input" 
                    autocomplete="email"
                >
            </div>
            <button type="submit" class="forgot-btn" id="submitBtn">
                <i class="fa-solid fa-paper-plane"></i> Отправить код
            </button>
        </form>

        <div class="forgot-back">
            <a href="/login">
                <i class="fa-solid fa-arrow-left"></i> Вернуться ко входу
            </a>
        </div>
    </div>
</section>
{{end}}
