{{define "qr-confirm"}}
<style>
    .qr-confirm-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
    }
    
    .qr-card {
        background: rgba(15,15,35,0.94);
        border: 1px solid rgba(139,92,246,0.12);
        border-radius: 2.5rem;
        padding: 3rem 2rem;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        animation: fadeUp 0.5s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .qr-icon {
        width: 64px; height: 64px;
        border-radius: 20px;
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 1.6rem; color: white;
        box-shadow: 0 8px 25px rgba(139,92,246,0.3);
    }
    .qr-title {
        font-size: 1.5rem; font-weight: 900;
        background: linear-gradient(135deg, #fff, #c4b5fd, #a78bfa);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        margin-bottom: 0.5rem;
    }
    .qr-desc {
        color: rgba(255,255,255,0.35); font-size: 0.9rem;
        margin-bottom: 2rem; line-height: 1.5;
    }
    .qr-desc b { color: rgba(255,255,255,0.6); }
    
    .qr-btn {
        padding: 0.9rem 2.5rem;
        border-radius: 2rem;
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        border: none; color: white; font-size: 0.95rem; font-weight: 700;
        cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem;
        box-shadow: 0 6px 20px rgba(139,92,246,0.3);
        transition: all 0.3s; text-decoration: none;
    }
    .qr-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(139,92,246,0.4); }
    .qr-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .qr-status {
        margin-top: 1.2rem;
        padding: 0.7rem 1.5rem;
        border-radius: 2rem;
        font-size: 0.82rem; font-weight: 600;
        display: inline-flex; align-items: center; gap: 0.4rem;
    }
    
    .qr-error {
        color: #ef4444; margin-bottom: 1.5rem; font-size: 0.9rem;
    }
    
    @media (max-width: 480px) {
        .qr-card { padding: 2rem 1.5rem; border-radius: 2rem; }
    }
</style>

<section class="qr-confirm-page">
    <div class="qr-card">
        <div class="qr-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <h1 class="qr-title">Подтверждение входа</h1>
        <p class="qr-desc">
            {{if .User}}
            Вход в аккаунт <b>{{.User.Username}}</b> с другого устройства
            {{else}}
            Вы пытаетесь войти в аккаунт с другого устройства
            {{end}}
        </p>
        
        {{if .User}}
        <button class="qr-btn" onclick="confirmLogin()">
            <i class="fa-solid fa-check"></i> Подтвердить вход
        </button>
        <div class="qr-status" id="confirmStatus" style="display:none;"></div>
        {{else}}
        <p class="qr-error"><i class="fa-solid fa-circle-exclamation"></i> Сначала войдите в аккаунт</p>
        <a href="/login" class="qr-btn">Войти</a>
        {{end}}
    </div>
</section>

<script>
async function confirmLogin() {
    var token = new URLSearchParams(window.location.search).get('token');
    var btn = document.querySelector('.qr-btn');
    var status = document.getElementById('confirmStatus');
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Подтверждение...';
    
    var resp = await fetch('/qr/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token })
    });
    var data = await resp.json();
    
    status.style.display = 'inline-flex';
    if (data.success) {
        status.innerHTML = '<i class="fa-solid fa-check-circle"></i> Вход подтверждён!';
        status.style.background = 'rgba(16,185,129,0.08)'; status.style.color = '#10b981';
        btn.style.display = 'none';
    } else {
        status.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> ' + (data.error || 'Ошибка');
        status.style.background = 'rgba(239,68,68,0.08)'; status.style.color = '#ef4444';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Подтвердить вход';
    }
}
</script>
{{end}}
