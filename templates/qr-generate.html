{{define "qr-generate"}}
<style>
    :root {
        --bg-deep: #08081c;
        --surface: rgba(18,18,44,0.75);
        --border: rgba(255,255,255,0.06);
        --border-hover: rgba(255,255,255,0.12);
        --text-primary: #f1f1f9;
        --text-secondary: rgba(255,255,255,0.45);
        --text-dim: rgba(255,255,255,0.25);
        --accent: #8b5cf6;
        --accent-light: #c084fc;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --radius-card: 2.25rem;
        --radius-item: 1.25rem;
        --transition: 0.25s cubic-bezier(0.33, 1, 0.68, 1);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(28px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes subtleShimmer {
        0% { background-position: -200% 50%; }
        100% { background-position: 200% 50%; }
    }
    @keyframes gradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(139,92,246,0.3); }
        50% { box-shadow: 0 0 0 16px rgba(139,92,246,0); }
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }
    @keyframes fadeSlide {
        from { opacity: 0; transform: translateY(15px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    body {
        background: radial-gradient(ellipse at 50% 0%, #15153a 0%, #08081c 70%);
        background-attachment: fixed;
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-primary);
        letter-spacing: -0.01em;
        min-height: 100vh;
    }

    .qr-gen-page {
        max-width: 560px;
        margin: 0 auto;
        padding: 5rem 1.5rem 4rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .qr-back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        transition: color 0.2s;
        width: fit-content;
    }
    .qr-back:hover { color: var(--accent-light); }

    .qr-card {
        background: var(--surface);
        backdrop-filter: blur(45px) saturate(140%);
        -webkit-backdrop-filter: blur(45px) saturate(140%);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 3rem 2.5rem;
        box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
        text-align: center;
        animation: fadeUp 0.5s ease;
        position: relative;
        overflow: hidden;
        transition: border-color var(--transition), box-shadow var(--transition);
    }
    .qr-card:hover {
        border-color: var(--border-hover);
        box-shadow: 0 24px 48px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(139,92,246,0.08);
    }
    .qr-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, 
            transparent 45%, 
            rgba(255,255,255,0.02) 50%, 
            transparent 55%);
        background-size: 200% 100%;
        animation: subtleShimmer 20s infinite;
        pointer-events: none;
    }
    .qr-card > * { position: relative; z-index: 1; }

    .qr-icon {
        width: 64px; height: 64px;
        border-radius: 20px;
        background: rgba(139,92,246,0.1);
        border: 1px solid rgba(139,92,246,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 1.8rem;
        color: var(--accent-light);
        animation: float 3s ease-in-out infinite;
    }

    .qr-title {
        font-size: 2rem;
        font-weight: 900;
        background: linear-gradient(135deg, #fff 0%, #d8c9ff 50%, #a78bfa 100%);
        background-size: 200% 200%;
        animation: gradientFlow 8s ease infinite;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 0.5rem;
        letter-spacing: -0.03em;
    }

    .qr-subtitle {
        color: var(--text-secondary);
        font-size: 0.95rem;
        margin: 0 0 2rem;
        font-weight: 500;
    }

    .qr-code-wrap {
        background: #fff;
        border-radius: 1.8rem;
        padding: 1.5rem;
        display: inline-block;
        margin: 0 auto 1.5rem;
        box-shadow: 0 0 0 1px rgba(139,92,246,0.15), 0 16px 40px rgba(0,0,0,0.3);
        animation: pulseGlow 4s ease-in-out infinite;
        position: relative;
        z-index: 1;
    }
    .qr-code-wrap canvas,
    .qr-code-wrap img {
        display: block;
        border-radius: 0.5rem;
    }

    .qr-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.8rem 1.5rem;
        border-radius: 100px;
        font-size: 0.85rem;
        font-weight: 600;
        margin: 0 auto 1.5rem;
        width: fit-content;
        background: rgba(139,92,246,0.06);
        border: 1px solid rgba(139,92,246,0.12);
        color: var(--accent-light);
        transition: all var(--transition);
    }
    .qr-status i { font-size: 0.9rem; }
    .qr-status-warning {
        background: rgba(245,158,11,0.08);
        border-color: rgba(245,158,11,0.2);
        color: #fbbf24;
        animation: fadeSlide 0.3s ease;
    }
    .qr-status-success {
        background: rgba(16,185,129,0.08);
        border-color: rgba(16,185,129,0.2);
        color: #6ee7b7;
        animation: fadeSlide 0.3s ease;
    }
    .qr-status-error {
        background: rgba(239,68,68,0.08);
        border-color: rgba(239,68,68,0.2);
        color: #fca5a5;
        animation: fadeSlide 0.3s ease;
    }

    .qr-actions {
        display: flex;
        justify-content: center;
        gap: 0.8rem;
        margin-bottom: 0.5rem;
        flex-wrap: wrap;
    }

    .qr-btn {
        padding: 0.7rem 1.5rem;
        border-radius: 100px;
        font-weight: 700;
        font-size: 0.85rem;
        cursor: pointer;
        border: none;
        transition: all var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        letter-spacing: -0.01em;
    }
    .qr-btn-outline {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-secondary);
    }
    .qr-btn-outline:hover {
        border-color: rgba(255,255,255,0.2);
        color: #fff;
        background: rgba(255,255,255,0.03);
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(0,0,0,0.3);
    }

    .qr-confirm-box {
        display: none;
        gap: 0.6rem;
        justify-content: center;
        margin-top: 1rem;
        animation: fadeSlide 0.3s ease;
        flex-wrap: wrap;
    }
    .qr-btn-approve {
        background: var(--success);
        color: #fff;
        box-shadow: 0 6px 16px rgba(16,185,129,0.25);
    }
    .qr-btn-approve:hover {
        background: #059669;
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(16,185,129,0.35);
    }
    .qr-btn-reject {
        background: transparent;
        border: 1px solid rgba(239,68,68,0.25);
        color: #f87171;
    }
    .qr-btn-reject:hover {
        background: rgba(239,68,68,0.08);
        border-color: rgba(239,68,68,0.4);
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(239,68,68,0.15);
    }

    @media (max-width: 480px) {
        .qr-card { padding: 2rem 1.5rem; }
        .qr-title { font-size: 1.6rem; }
        .qr-code-wrap { padding: 1rem; }
    }
</style>

<section class="qr-gen-page">
    <a href="/profile" class="qr-back"><i class="fa-solid fa-arrow-left"></i> Назад в профиль</a>

    <div class="qr-card">
        <div class="qr-icon"><i class="fa-solid fa-qrcode"></i></div>
        <h1 class="qr-title">QR-вход</h1>
        <p class="qr-subtitle">Отсканируйте код на телефоне для входа в аккаунт</p>

        <div class="qr-code-wrap">
            <div id="qrCode"></div>
        </div>

        <div class="qr-status" id="qrStatus">
            <i class="fa-solid fa-spinner fa-spin"></i> Ожидание сканирования...
        </div>

        <div class="qr-actions">
            <button onclick="generateNewQR()" class="qr-btn qr-btn-outline">
                <i class="fa-solid fa-rotate"></i> Новый QR
            </button>
        </div>

        <div class="qr-confirm-box" id="confirmBox">
            <button onclick="approveLoginDirect()" class="qr-btn qr-btn-approve">
                <i class="fa-solid fa-check"></i> Разрешить вход
            </button>
            <button onclick="rejectLogin()" class="qr-btn qr-btn-reject">
                <i class="fa-solid fa-xmark"></i> Отклонить
            </button>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" crossorigin="anonymous"></script>
<script>
var currentToken = '';
var checkInterval = null;

async function generateNewQR() {
    try {
        var resp = await fetch('/qr/generate');
        var data = await resp.json();
        if (!data.token) return;
        currentToken = data.token;
        document.getElementById('qrCode').innerHTML = '';
        new QRCode(document.getElementById('qrCode'), {
            text: window.location.origin + '/qr-login?token=' + data.token,
            width: 200, height: 200,
            colorDark: '#8b5cf6', colorLight: '#ffffff'
        });
        updateStatus('waiting');
        document.getElementById('confirmBox').style.display = 'none';
        if (checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(checkStatus, 2000);
    } catch(e) {
        console.error('generateNewQR error:', e);
    }
}

function updateStatus(status) {
    var s = document.getElementById('qrStatus');
    s.className = 'qr-status';
    switch(status) {
        case 'waiting':
            s.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Ожидание сканирования...';
            break;
        case 'scanned':
            s.innerHTML = '<i class="fa-solid fa-mobile-screen-button"></i> Кто-то хочет войти';
            s.className = 'qr-status qr-status-warning';
            break;
        case 'approved':
            s.innerHTML = '<i class="fa-solid fa-check"></i> Вход разрешён';
            s.className = 'qr-status qr-status-success';
            break;
        case 'confirmed':
            s.innerHTML = '<i class="fa-solid fa-check-circle"></i> Вход выполнен!';
            s.className = 'qr-status qr-status-success';
            break;
        case 'expired':
            s.innerHTML = '<i class="fa-solid fa-clock"></i> QR-код истёк';
            s.className = 'qr-status qr-status-error';
            break;
    }
}

async function checkStatus() {
    if (!currentToken) return;
    try {
        var resp = await fetch('/qr/check/' + currentToken.split('.')[0]);
        var data = await resp.json();
        if (data.status === 'scanned') {
            document.getElementById('confirmBox').style.display = 'flex';
            updateStatus('scanned');
        } else if (data.status === 'approved') {
            document.getElementById('confirmBox').style.display = 'none';
            updateStatus('approved');
        } else if (data.status === 'confirmed') {
            clearInterval(checkInterval);
            document.getElementById('confirmBox').style.display = 'none';
            updateStatus('confirmed');
        } else if (data.status === 'expired') {
            clearInterval(checkInterval);
            updateStatus('expired');
        }
    } catch(e) {
        console.error('checkStatus error:', e);
    }
}

async function approveLoginDirect() {
    try {
        await fetch('/qr/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: currentToken, action: 'approve' })
        });
        updateStatus('approved');
        document.getElementById('confirmBox').style.display = 'none';
    } catch(e) {}
}

async function rejectLogin() {
    try {
        await fetch('/qr/reject', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: currentToken })
        });
        updateStatus('waiting');
        document.getElementById('confirmBox').style.display = 'none';
        setTimeout(generateNewQR, 1000);
    } catch(e) {}
}

generateNewQR();
</script>
{{end}}
